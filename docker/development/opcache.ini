; OPcache for the DEV container.
;
; The dev image ships with OPcache compiled in but disabled, so PHP recompiles
; every file on every request. With the source bind-mounted from the host, each
; of those reads also crosses the VirtioFS boundary — on a machine with
; endpoint-security file interception that is the dominant cost of a page load
; (measured: 235-390ms -> 22-27ms on a trivial API call).
;
; validate_timestamps stays ON so edits still take effect; revalidate_freq is
; the staleness window in seconds.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
